<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script src="/js/ga4.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leave a Review | Booking Mongolia</title>
  <meta name="description" content="Leave a guest review for your Booking Mongolia hotel stay or driver trip." />
  <meta name="robots" content="noindex,nofollow" />
  <style>
    :root{--primary:#0d3b66;--accent:#c98b2f;--bg:#f7f5ef;--muted:#6b7280;--line:#e5e7eb}
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#1f2937;line-height:1.6}
    a{color:var(--primary);text-decoration:none}
    .wrap{max-width:720px;margin:0 auto;padding:28px 16px 90px}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 16px;border-radius:999px;font-weight:800;border:0;cursor:pointer;min-height:46px}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-outline{background:#fff;border:1px solid var(--line);color:var(--primary)}
    .card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 12px 28px rgba(0,0,0,.06)}
    h1{margin:0 0 8px;font-size:clamp(24px,4vw,34px);color:var(--primary)}
    .muted{color:var(--muted)}
    .meta{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0;display:grid;gap:6px}
    .state{padding:30px 10px;text-align:center;color:var(--muted)}
    .error{color:#b91c1c}
    .badge{display:inline-flex;padding:5px 10px;border-radius:999px;background:#ecfdf5;color:#166534;font-size:12px;font-weight:800;border:1px solid #86efac}
  </style>
  <script src="/js/guest-reviews.js"></script>
</head>
<body>
  <div class="wrap">
    <div style="margin-bottom:16px">
      <a class="btn btn-outline" href="/index.html">← Booking Mongolia</a>
    </div>
    <div class="card" id="review-root">
      <div class="state">Loading your review form...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://ebpjetcuabubihzximbb.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_3F9zG4HoMOCgU4yHvUkiKw_h5VTeeRF";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function qs(name) {
      return new URLSearchParams(window.location.search).get(name);
    }
    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    function formatDate(value) {
      if (!value) return "";
      try {
        return new Date(value).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
      } catch (e) {
        return String(value);
      }
    }

    async function loadTarget(reviewType, id) {
      if (reviewType === "hotel") {
        const { data } = await supabaseClient
          .from("property_submissions")
          .select("id,name,location,status")
          .eq("id", id)
          .maybeSingle();
        return data;
      }
      const { data } = await supabaseClient
        .from("vehicle_submissions")
        .select("id,title,vehicle_type,contact_name,status")
        .eq("id", id)
        .maybeSingle();
      return data;
    }

    async function fetchInvite(token) {
      const res = await fetch(`/.netlify/functions/submit-review?token=${encodeURIComponent(token)}`);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Invalid review link");
      return data.invite;
    }

    function mountForm(root, {
      reviewType,
      targetId,
      targetName,
      serviceDate,
      bookingRef,
      prefill,
      token,
      verified
    }) {
      root.innerHTML = `
        <h1>Leave a Review</h1>
        <p class="muted">Thank you for traveling with Booking Mongolia. Your feedback helps other guests.</p>
        <div class="meta">
          ${verified ? `<div><span class="badge">Verified review link</span></div>` : ""}
          <div><strong>Service:</strong> ${escapeHtml(reviewType === "hotel" ? "Hotel stay" : "Driver trip")}</div>
          <div><strong>${reviewType === "hotel" ? "Hotel" : "Driver"}:</strong> ${escapeHtml(targetName || targetId)}</div>
          ${serviceDate ? `<div><strong>Service date:</strong> ${escapeHtml(formatDate(serviceDate))}</div>` : ""}
          ${bookingRef ? `<div><strong>Booking ref:</strong> ${escapeHtml(bookingRef)}</div>` : ""}
        </div>
        ${BMReviews.formHtml({
          reviewType,
          targetId,
          prefill: prefill || {},
          showServiceDate: !serviceDate
        })}
      `;

      BMReviews.bindStarInputs(root);
      const form = document.getElementById("bm-guest-review-form");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const notice = document.getElementById("bm-review-notice");
        const btn = form.querySelector(".bm-submit-review");
        try {
          const payload = BMReviews.collectForm(form);
          if (!payload.rating) throw new Error("Please select an overall rating");
          if (btn) btn.disabled = true;
          await BMReviews.submitReview(payload, { token });
          root.innerHTML = `
            <h1>Thank you</h1>
            <p>Your review was submitted and is pending moderation.${verified ? " Verified Guest badge will appear after approval." : ""}</p>
            <p><a class="btn btn-primary" href="/index.html">Back to Booking Mongolia</a></p>
          `;
        } catch (err) {
          if (notice) {
            notice.hidden = false;
            notice.className = "bm-notice err";
            notice.textContent = err.message || "Could not submit review.";
          }
          if (btn) btn.disabled = false;
        }
      });
    }

    async function init() {
      if (window.BMReviews) BMReviews.mountStyles();
      const root = document.getElementById("review-root");
      const token = qs("token");
      let typeParam = qs("type");
      let idParam = qs("id");

      if (token) {
        let invite = null;
        try {
          invite = await fetchInvite(token);
        } catch (e) {
          root.innerHTML = `<h1>Leave a Review</h1><p class="error">${escapeHtml(e.message)}</p>`;
          return;
        }
        if (invite.used) {
          root.innerHTML = `<h1>Link already used</h1><p class="muted">This review invite was already submitted. Thank you!</p>`;
          return;
        }

        typeParam = invite.review_type || typeParam;
        idParam = (typeParam === "hotel" ? invite.hotel_id : invite.driver_id) || idParam;
        const serviceDate = invite.service_date || qs("date") || "";
        const bookingRef = invite.booking_ref || qs("ref") || "";
        const prefill = {
          guest_name: invite.guest_name || qs("name") || "",
          guest_country: invite.guest_country || qs("country") || "",
          service_date: serviceDate
        };

        if (!typeParam || !idParam) {
          root.innerHTML = `<h1>Leave a Review</h1><p class="error">This invite is incomplete. Please contact Booking Mongolia.</p>`;
          return;
        }

        let targetName = "";
        try {
          const target = await loadTarget(typeParam, idParam);
          targetName = typeParam === "hotel"
            ? (target?.name || "Hotel")
            : (target?.title || target?.vehicle_type || "Driver");
        } catch (e) {}

        mountForm(root, {
          reviewType: typeParam,
          targetId: idParam,
          targetName,
          serviceDate,
          bookingRef,
          prefill,
          token,
          verified: true
        });
        return;
      }

      if (typeParam && idParam && ["hotel", "driver"].includes(typeParam)) {
        let targetName = "";
        try {
          const target = await loadTarget(typeParam, idParam);
          targetName = typeParam === "hotel"
            ? (target?.name || "Hotel")
            : (target?.title || target?.vehicle_type || "Driver");
        } catch (e) {}

        mountForm(root, {
          reviewType: typeParam,
          targetId: idParam,
          targetName,
          serviceDate: "",
          bookingRef: "",
          prefill: {},
          token: null,
          verified: false
        });
        return;
      }

      root.innerHTML = `
        <h1>Leave a Review</h1>
        <p class="error">This page needs a review invite link from Booking Mongolia, or a hotel/driver link.</p>
        <p class="muted">Open a hotel or driver page and use <strong>Write a Review</strong>.</p>
      `;
    }

    init();
  </script>
</body>
</html>
